<form action="">

  <div class="text-center text-blanco-roto pt-3">
    <h2>Registro</h2>
  </div>

  <hr>
  <!--  //<<<<<<<0. Inputs >>>>>>-->
  <div class="px-3">

    <div class="inputs" id="nombres">

      <div >
        <label>Nombre:
        <input type="text" placeholder="Nombre">
        </label>
      </div>

      <div >
        <label>Apellidos:
        <input type="text" placeholder="Apellidos">
        </label>
      </div>

    </div>

    <div class="inputs">

      <label class="mb-2">

        <input type="email" placeholder="Correo Electrónico @gmail.com">

      <input type="password" class="mb-3" placeholder="Contraseña">

    </div>

    <div class="d-flex gap-3 mb-3">

      </div>

  </div>
  <hr>
  <!--  //<<<<<<<1. iniciar sesión con x >>>>>>-->

      <div class="d-flex gap-2">
        <i class="bi bi-facebook fs-4 text" id="face"></i>
        <i class="bi bi-google fs-4" id="you"></i>
        <i class="bi bi-twitter-x fs-4" id="x"></i>
      </div>
    </div>
  <hr>
  <div class="w-75 d-flex mx-auto justify-content-between pb-4">
    <button class="text-blanco-roto button-trans-unborder border-white">Registrarse</button>
    <button class="text-blanco-roto button-trans-unborder border-white">Iniciar Sesión</button>
