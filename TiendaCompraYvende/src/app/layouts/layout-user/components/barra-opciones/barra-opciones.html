<!--//<<<<<< 0. contenedor padre>>>>>>>-->

<div class="justify-content-between" id="barra" [ngClass]="barra()?'d-none':'d-block'">

  <div>

    <div class="mb-5" id="parte1">
      <!--  //<<<<<< 1. logo  >>>>>>>-->
      <div class="forma">

        <div class="drop"  >

          <button type="button" class=" btn btn-transparent" (click)="toggleDrop()">
            <i class="bi bi-person-badge-fill text-white fs-2" ></i>
          </button>

        </div>

          <div appClickFuera (fuera)="cerrarDrop()"
               class="cont" [ngClass]="[drop()?'visible':'invisible']" >
            <i class="text-wrap">hola</i>
            <button class="btn btn-success">preciona</button>

          </div>

      </div>

      <!--  //<<<<<< 2. opciones user  >>>>>>>-->
      <div>

      </div>
    </div>

    <div class="" id="parte2">

      <button  type="button" class="w-100 d-flex justify-content-start rounded-3 btn " [routerLink]="['/sesion/inicio']"
      [ngClass]="[estado==='inicio'?'focus':'button-parte2']" (click)="cambiarEstado('inicio')">
        <i class="bi bi-houses-fill"></i>
        Inicio
      </button>

      <button class="w-100 d-flex justify-content-start rounded-3 btn " [routerLink]="['/sesion/explorer']"
              [ngClass]="[estado==='explorar'?'focus':'button-parte2']" (click)="cambiarEstado('explorar')">
        <i class="bi bi-bag-fill"></i>
        Explorar
      </button>

      <button class="w-100 d-flex justify-content-start rounded-3 btn " [routerLink]="['/sesion/user']"
              [ngClass]="[estado==='perfil'?'focus':'button-parte2']" (click)="cambiarEstado('perfil')">
        <i class="bi bi-person-fill"></i>
        perfil
      </button>

    </div>

  </div>


  <button type="button" class="parte2 bg-dorado-suave d-flex justify-content-center py-2 rounded-3 btn text-dark" id="salir"
          (click)="cerrarSesion()" >
    <i class="bi bi-door-open-fill"></i>
  </button>


</div>
<button class="bg-dorado-suave rounded-0 p-0" id="mi-btn" (click)="toggleBarra()" [ngClass]="[barra()?'enMedio rounded-end-2':'']">
  <b><i class="bi m-0 px-1" [ngClass]="barra()?'bi-arrow-right-circle-fill':'bi-arrow-left-circle-fill'" ></i></b>
</button>

<app-cargando-model  [icono]="tipeResp()"
                     (cerrarIcono)="changeIcono(Number($event))"
></app-cargando-model>
