<h2 class="m-0">Productos</h2>
<hr class="mt-0">

<div class="w-100 d-grid" id="productos">
  @for (p of Productos(); track p.nombre) {
    <div class="producto bg-white p-2 rounded-2">
      <img src="" class="m-0 mb-2" alt="">
      <div>
        <h5>{{ p.nombre }}</h5>
        <p>{{ p.precio }}</p>
      </div>
    </div>
  }
</div>
