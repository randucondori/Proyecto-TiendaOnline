<h2 class="m-0">Productos</h2>
<hr class="mt-0">

<div class="w-100 d-grid" id="productos">
  @for (p of Productos(); track p.nombre) {
    <div class="card llevar" style="width: 18rem;">
      <img src="{{p.img}}" class="card-img-top h-75 object-fit-cover" alt="...">
      <div class="card-body">
        <h5 class="card-title">{{p.nombre}}</h5>
        <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content.</p>
      </div>
    </div>
  }
</div>
