<div id="carrito" class="bg-white shadow-lg position-fixed">

  <div class=" position-relative " >
    <p class="h2 text-center">Compras</p>
    <button type="button" class="btn btn-danger position-absolute " id="close" (click)="cerrar()">
      <i class="bi bi-x-lg text-white"></i>
    </button>
  </div>

  <div id="contenido" class="overflow-y-auto d-grid">
    @for(p of productos();track p){
      <div class="comprado shadow-sm border-top bg-beige-muy-claro pe-2">
        <img src="{{p.info[1]}}" alt="img" width="30%" height="100%">
        <div class="d-grid">
          <p class="m-0 text-primary">{{p.nombre}}</p>
          <b>{{p.info[0]}}€ x {{p.info[2]}}</b>
        </div>
        <button type="button" class="btn btn-warning text-dark" (click)="eliminarCompra(p)">
          <i class="bi bi-trash-fill"></i>
        </button>
      </div>
    }
  </div>
  <div class="w-100 d-flex justify-content-between">
    <b>Total :</b>
    <i>{{total!=0?total:'0.00'}}€</i>
  </div>

  <button type="button" class="btn btn-info">Pagar €/s</button>

</div>
