<div id="carrito" class="bg-white shadow-lg position-fixed">

  <div class=" position-relative ">
    <p class="h2 text-center">Compras</p>
    <button type="button" class="btn btn-danger position-absolute " id="close" (click)="cerrar()">
      <i class="bi bi-x-lg text-white"></i>
    </button>
  </div>

  <button class="btn btn-outline-warning my-3" (click)="LimpiarCompra()"><i class="bi bi-trash2">Eliminar todo el
    carrito</i></button>

  <div id="contenido" class="overflow-y-auto ">
    @for (p of productos(); track p.nombre) {
      <div class="comprado shadow-sm border-top bg-beige-muy-claro">

        <div class="box-img">
          <img src="{{p.info[1]}}" alt="img" width="100%" height="100%">
        </div>

        <div class="two d-flex align-items-center ms-1">
          <p class="m-0 text-primary text-decoration-underline">{{ p.info[3] }}</p>

          <div class="d-flex align-items-center gap-2">

            <div class="precios">
              <b><i class="bg-dorado-suave px-2 py-1 rounded-2">{{ p.info[0] }}€</i> x <i
                class="bg-white px-2 py-1 rounded-3">{{ p.info[2] }}</i></b>
            </div>

            <div class="d-grid">
              <button class="btn  p-0" (click)="addCompra(p.nombre,p.info[3],p.info[0],p.info[1])">
                <i class="bi bi-caret-up-fill"></i>
              </button>
              <button class="btn  p-0" (click)="eliminarCompra(p.nombre)">
                <i class="bi bi-caret-down-fill"></i>
              </button>
            </div>

          </div>

          <button type="button" class="btn btn-warning text-dark ms-2" (click)="eliminarUno(p.nombre)">
            <i class="bi bi-trash-fill"></i>
          </button>
        </div>


      </div>
    }
  </div>
  <div class="w-100 d-flex justify-content-between fs-3">
    <b>Total :</b>
    <i>{{ total() !== 0 ? total().toFixed(2) : '0.00' }}€</i>
  </div>

  <button type="button" class="btn btn-info" (click)="togglePago()">Pagar €/s</button>

</div>
@if(pago()){
  <app-pasarela (salir)="togglePago()"></app-pasarela>
}
