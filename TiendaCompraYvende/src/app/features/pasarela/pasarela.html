<div class="vw-100 vh-100 bg-carbon opacity-25 position-fixed top-0 z-3"></div>

<div class="position-absolute z-3 w-100 h-100">

  <div class="bg-white my-5 m-auto rounded-2 shadow-lg" id="compra">
    <div class="py-3 px-2">

      <div class="position-relative">

        <h2 class="text-center mb-0 ">Pago</h2>
        <i class="bi bi-x-lg fs-4 position-absolute" id="cerrar" (click)="salir.emit()"></i>

      </div>

      <div class=" border-bottom mb-2 mt-3 d-grid justify-content-center" id="estado">

        <div class="d-flex pago gap-2 px-3 w-100 justify-content-center"
             [ngClass]="[estado()===0?'estado texto-dorado':'']">
          <i class="bi bi-bag-check"></i>
          <p class="m-0">Pre compra</p>
        </div>

        <div class="d-flex pago gap-2 px-3 w-100 justify-content-center"
             [ngClass]="[estado()===1?'estado texto-dorado':'']">
          <i class="bi bi-bag-check"></i>
          <p class="m-0">envio</p>
        </div>


      </div>

    </div>

    <form action="" class="" id="formulario" [formGroup]="pagoFrom">

      <div class="bg-blanco-roto w-100 p-2 rounded-2 text-dark" id="contenido">

        <div class="w-100 bg-dorado-suave lava-lamp" id="card">
          <div class="bubble"></div>
          <div class="bubble"></div>
          <div class="bubble"></div>
        </div>

        <div class="d-flex justify-content-between">
          <p class="m-0">Precio de compra :</p>
          <p clasS="m-0 text-start text-decoration-underline">{{ pre().toFixed(2) }}/€</p>
        </div>

        <div class="d-flex justify-content-between">
          <p class="m-0">Precio de Envió :</p>
          <p clasS="m-0 text-start text-decoration-underline">{{ envio() }}/€</p>
        </div>

        <div class="d-flex justify-content-between">
          <p class="m-0">Precio del IVA:</p>
          <p clasS="m-0 text-start text-decoration-underline">{{ IVA() }}/€</p>
        </div>

        <hr>

        <div class="d-flex justify-content-between">
          <p class="m-0 fs-4">Precio Total:</p>
          <p clasS="m-0 fs-4 text-start text-decoration-underline">{{ total() }}/€</p>
        </div>

      </div>

      <div class="w-100 d-grid my-3" [ngClass]="[estado()===0?'d-block':'d-none']">

        <i class="text-center fs-3 fst-italic fw-bold">Información personal</i>

        <div>

          <div class="">
            <label class="form-label w-100">Dirección
              <input class="form-control" placeholder="C. 00 ciudad"
                     formControlName="direccion" [ngClass]="
                     [pagoFrom.get('direccion')?.touched && pagoFrom.get('direccion')?.errors?'invalido':'',
                      pagoFrom.get('direccion')?.touched && !pagoFrom.get('direccion')?.errors?'valido':'']">
            </label>
          </div>

          <div class="">
            <label class="form-label w-100">Teléfono
              <input class="form-control" placeholder="000 000 000"
                     formControlName="telefono" [ngClass]="
                     [pagoFrom.get('telefono')?.touched && pagoFrom.get('telefono')?.errors?'invalido':'',
                      pagoFrom.get('telefono')?.touched && !pagoFrom.get('telefono')?.errors?'valido':'']">
            </label>
          </div>

        </div>

        <button type="button" class=" btn btn-info my-3" id="uno" (click)="toggleEstado(1)">Siguiente
          <i class="bi bi-arrow-right"></i>
        </button>

      </div>

      <div class="w-100 d-grid my-3" [ngClass]="[estado()===0?'d-none':'d-block']">
        <i class="fs-3 text-center">Métodos de pago</i>


        <div class="d-flex gap-2">
          <button type="button" class=" btn btn-info my-3" id="uno" (click)="toggleEstado(0)">
            <i class="bi bi-arrow-left"></i>Volver
          </button>

          <button type="button" class=" btn btn-info my-3" id="uno">
            <i class="bi bi-cash-coin me-2"></i>Pagar
          </button>
        </div>
      </div>


    </form>

  </div>

</div>
