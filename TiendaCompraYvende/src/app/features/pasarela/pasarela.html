<div class="vw-100 vh-100 bg-carbon opacity-25 position-fixed top-0 z-3"></div>

<div class="position-absolute z-3 w-100 h-100">

  <div class="bg-white w-25 h-75 my-5 m-auto rounded-2 shadow-lg">
    <div class="py-3 px-2">

      <div class="position-relative">

        <h2 class="text-center mb-0 ">Proceso de Pago</h2>
        <i class="bi bi-x-lg fs-4 position-absolute" id="cerrar" (click)="salir.emit()"></i>

      </div>

      <div class=" border-bottom mb-2 mt-3 d-grid " id="estado">

        <div class="d-flex pago gap-2 px-3 w-75 justify-content-center" [ngClass]="[estado()===0?'estado texto-dorado':'precionable']">
          <i class="bi bi-bag-check"></i>
          <p class="m-0" (click)="toggleEstado(0)">envio</p>
        </div>

        <div class="d-flex pago gap-2 px-3 w-75 justify-content-center" [ngClass]="[estado()===1?'estado texto-dorado':'precionable']">
          <i class="bi bi-bag-check"></i>
          <p class="m-0" (click)="toggleEstado(1)">envio</p>
        </div>


      </div>

    </div>

    <form action="">

    </form>

  </div>

</div>
