<!--//<<<<<<<<<<0. Contenedor padre>>>>>>>>>-->
<div class="p-3 w-100">
<!--  //<<<<<<<<<<1. Buscador>>>>>>>>>-->
  <div class="input-group w-75">
    <button type="button" class="btn btn-info "><i class="bi bi-search"></i></button>
    <input type="text" class="form-control " placeholder="Buscar . . . ">
  </div>
<!--  //<<<<<<<<<<2. Zona comprar productos>>>>>>>>>-->

<!--  //<<<<<<<<<<3. categorias>>>>>>>>>-->
  <br>
  <div class="w-100 overflow-x-auto px-3 py-2 rounded-3 d-flex gap-4" id="categorias">
    @for(c of categorias();track c.slug){
      <button type="button" class="btn" [ngClass]="[c.slug===cat?'btn-dark':'btn-outline-dark']"
              (click)="changeCat(c.slug)"
      >{{c.nombre}}</button>
    }
  </div>
  <br>
<!--  //<<<<<<<<<<4. Productos>>>>>>>>>-->
  <div id="productosBuscados">
    @for(p of productos();track p.slug){

      <div class="rounded-3 bg-white p-2 d-grid justify-content-center">

        <div class="producto">
          <img src="{{p.img}}" alt="">
        </div>


        <div class="py-2">
          <p>{{p.nombre}}</p>
          <b><i class="text-warning">Precio : </i> {{p.precio}}€</b>
        </div>

        <button class="btn w-100 add" (click)="comprar(p,p.nombre)">
          Añadir al Carrito
        </button>

      </div>

    }

  </div>



<!--  //<<<<<<<<<<5. notificaciones>>>>>>>>>-->
  <div class="position-absolute " id="notificacion">
    @for(n of notificaciones();track n){
      <div class="alert alert-success d-block" role="alert">
        <b clasS="text-dark">{{n}}</b> añadido al carrito
      </div>
    }
  </div>

</div>
